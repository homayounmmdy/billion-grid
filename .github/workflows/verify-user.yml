# .github/workflows/verify-user.yml
name: Verify User Claim

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'public/grid-data.json'
  issue_comment:
    types: [created, edited]

jobs:
  verify:
    name: Verify User Confirmation
    runs-on: ubuntu-latest
    # Only run if it's a PR modifying grid-data.json, or a comment on such a PR
    if: |
      (github.event_name == 'pull_request' && contains(github.event.pull_request.changed_files, 'public/grid-data.json')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify User Confirmation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          cat << 'EOF' > verify.js
          const { execSync } = require('child_process');
          
          const prNumber = process.env.PR_NUMBER;
          const repo = process.env.REPO;
          const token = process.env.GITHUB_TOKEN;
          
          function readFromGit(ref) {
            try {
              const output = execSync(`git show ${ref}:public/grid-data.json`, { encoding: 'utf-8' });
              return JSON.parse(output || '[]');
            } catch {
              return [];
            }
          }
          
          const previousData = readFromGit('origin/main');
          const currentData = readFromGit('HEAD');
          
          const previousKeys = new Set(previousData.map(item => `${item.x},${item.y},${item.userId}`));
          const newEntries = currentData.filter(item => !previousKeys.has(`${item.x},${item.y},${item.userId}`));
          
          if (newEntries.length === 0) {
            console.log("No new squares added in this PR. Nothing to verify.");
            process.exit(0);
          }
          
          if (newEntries.length > 1) {
            console.log("Multiple new squares detected. Skipping user verification (handled by validate-grid.yml).");
            process.exit(0);
          }
          
          const newUserId = newEntries[0].userId;
          console.log(`🔍 Checking confirmation for new claim by: @${newUserId}`);
          
          // Fetch comments on this PR
          const commentsUrl = `https://api.github.com/repos/${repo}/issues/${prNumber}/comments`;
          const commentsRes = execSync(`curl -s -H "Authorization: token ${token}" -H "Accept: application/vnd.github.v3+json" "${commentsUrl}"`, { encoding: 'utf-8' });
          const comments = JSON.parse(commentsRes);
          
          // Check if the newUserId has commented "@confirm yes" (case-insensitive)
          const hasConfirmed = comments.some(comment => 
            comment.user.login.toLowerCase() === newUserId.toLowerCase() && 
            comment.body.toLowerCase().includes('@confirm yes')
          );
          
          if (hasConfirmed) {
            console.log(`✅ Success: User @${newUserId} has confirmed the claim.`);
            process.exit(0);
          } else {
            console.error(`❌ FAILED: User @${newUserId} has not confirmed this claim.`);
            console.error(`---------------------------------------------------------------`);
            console.error(`ACTION REQUIRED: The person who claimed this square must visit`);
            console.error(`this Pull Request and leave a comment saying exactly:`);
            console.error(`    @confirm yes`);
            console.error(`---------------------------------------------------------------`);
            process.exit(1);
          }
          EOF
          
          node verify.js
