# .github/workflows/validate-grid.yml
# Runs on every push and pull request to validate grid-data.json
# This catches violations that bypass local Husky hooks (e.g., GitHub web UI edits)

name: Validate Grid Data

on:
  push:
    paths:
      - 'public/grid-data.json'
  pull_request:
    paths:
      - 'public/grid-data.json'

jobs:
  validate:
    name: Validate grid-data.json
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # CRITICAL: Fetch all history so we can accurately compare against the 'main' branch
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (if needed)
        run: npm ci --ignore-scripts || true

      - name: Run validation script
        run: node scripts/validate-grid.js
        env:
          CI: true
