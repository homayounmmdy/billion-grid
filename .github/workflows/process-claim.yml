# .github/workflows/process-claim.yml
name: Process Block Claim

on:
  issues:
    types: [opened, labeled]

jobs:
  process-claim:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Parse issue and validate claim
        id: parse-issue
        run: |
          node << 'EOF'
          const fs = require('fs');
          const path = require('path');
          
          const issueTitle = process.env.ISSUE_TITLE;
          const issueBody = process.env.ISSUE_BODY || '';
          const issueUser = process.env.ISSUE_USER;
          const issueNumber = process.env.ISSUE_NUMBER;
          const githubOutput = process.env.GITHUB_OUTPUT;
          
          // Helper function to fail with a specific reason
          function failWithReason(reason) {
            fs.appendFileSync(githubOutput, `error_reason=${reason}\n`);
            console.error(`❌ ${reason}`);
            process.exit(1);
          }

          // 1. Validate Issue Title
          if (!issueTitle.includes('Claim: Square')) {
            console.log('ℹ️ Issue title does not match "Claim: Square". Skipping.');
            process.exit(0);
          }
          
          // 2. Parse Issue Body
          const data = {};
          const lines = issueBody.split('\n');
          for (const line of lines) {
            const trimmed = line.trim();
            if (trimmed.startsWith('X:')) data.x = trimmed.replace('X:', '').trim();
            else if (trimmed.startsWith('Y:')) data.y = trimmed.replace('Y:', '').trim();
            else if (trimmed.startsWith('Color:')) data.color = trimmed.replace('Color:', '').trim();
            else if (trimmed.startsWith('UserId:')) data.userid = trimmed.replace('UserId:', '').trim();
          }
          
          if (!data.x || !data.y || !data.color || !data.userid) {
            failWithReason('Missing required fields. Please ensure X, Y, Color, and UserId are provided in the issue body.');
          }
          
          const x = parseInt(data.x, 10);
          const y = parseInt(data.y, 10);
          
          if (isNaN(x) || isNaN(y)) {
            failWithReason('Invalid coordinates. X and Y must be valid numbers.');
          }
          
          // 3. Read existing grid data
          const filePath = 'public/grid-data.json';
          if (!fs.existsSync(filePath)) {
            fs.mkdirSync(path.dirname(filePath), { recursive: true });
            fs.writeFileSync(filePath, '[]');
          }
          
          let gridData = [];
          try {
            gridData = JSON.parse(fs.readFileSync(filePath, 'utf8'));
          } catch (e) {
            gridData = [];
          }
          
          // 4. Validation Check: Is coordinate taken?
          const existingCoordinate = gridData.find(block => block.x === x && block.y === y);
          if (existingCoordinate) {
            failWithReason(`The coordinates (${x}, ${y}) are already claimed by UserId: \`${existingCoordinate.userId}\`.`);
          }
          
          // 5. Add new block to JSON (Simplified)
          const newBlock = {
            x: x,
            y: y,
            userId: data.userid,
            color: data.color,
            timestamp: new Date().toISOString()
          };
          
          gridData.push(newBlock);
          fs.writeFileSync(filePath, JSON.stringify(gridData, null, 2));
          
          // 6. Save outputs for the PR step
          fs.appendFileSync(githubOutput, `x=${x}\n`);
          fs.appendFileSync(githubOutput, `y=${y}\n`);
          fs.appendFileSync(githubOutput, `color=${data.color}\n`);
          fs.appendFileSync(githubOutput, `userid=${data.userid}\n`);
          fs.appendFileSync(githubOutput, `valid=true\n`);
          
          // Save metadata for comments
          fs.writeFileSync('/tmp/claim-info.json', JSON.stringify({ ...newBlock, issueUser, issueNumber }));
          
          console.log('✅ Claim validated and JSON updated successfully.');
          EOF
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}

      - name: Create Pull Request
        id: create-pr
        if: steps.parse-issue.outputs.valid == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat: add block claim for @${{ github.event.issue.user.login }} (#${{ github.event.issue.number }})"
          branch: "claim/issue-${{ github.event.issue.number }}"
          delete-branch: true
          title: "🎯 Block claim by @${{ github.event.issue.user.login }} (#${{ github.event.issue.number }})"
          body: |
            ## 🎯 Automated Block Claim
            
            This PR adds a new block to `public/grid-data.json` based on an issue request.
            
            ### 📋 Claim Details
            - **Claimed By (GitHub):** @${{ github.event.issue.user.login }}
            - **Requested UserId:** `${{ steps.parse-issue.outputs.userid }}`
            - **Coordinates:** (`${{ steps.parse-issue.outputs.x }}`, `${{ steps.parse-issue.outputs.y }}`)
            - **Color:** `${{ steps.parse-issue.outputs.color }}`
            - **Source Issue:** #${{ github.event.issue.number }}
            
            ### 📝 Changes
            This PR appends the new entry to [public/grid-data.json](https://github.com/homayounmmdy/billion-grid/blob/main/public/grid-data.json).
            
            *This PR was automatically generated and merged by the **Process Block Claim** workflow.*
            
            Closes #${{ github.event.issue.number }}
          labels: "automated-pr, block-claim"

      - name: Auto-merge Pull Request
        if: steps.create-pr.outputs.pull-request-number != ''
        uses: actions/github-script@v8
        with:
          script: |
            const prNumber = parseInt('${{ steps.create-pr.outputs.pull-request-number }}', 10);
            if (prNumber) {
              try {
                await github.rest.pulls.merge({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  merge_method: 'squash'
                });
                console.log(`✅ PR #${prNumber} auto-merged successfully.`);
              } catch (error) {
                console.error(`❌ Failed to auto-merge PR #${prNumber}:`, error.message);
              }
            }

      - name: Close Issue
        if: steps.create-pr.outputs.pull-request-number != ''
        uses: actions/github-script@v8
        with:
          script: |
            try {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: ${{ github.event.issue.number }},
                state: 'closed'
              });
              console.log('✅ Issue closed successfully.');
            } catch (error) {
              console.error('❌ Failed to close issue:', error.message);
            }

      - name: Comment on issue (Success)
        if: success() && steps.parse-issue.outputs.valid == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const claimInfo = JSON.parse(fs.readFileSync('/tmp/claim-info.json', 'utf8'));
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: claimInfo.issueNumber,
              body: `✅ **Claim validated, merged, and issue closed!**\n\n` +
                    `Your block at **(${claimInfo.x}, ${claimInfo.y})** for user **${claimInfo.userId}** has been successfully added to the grid.\n\n` +
                    `No further action is required.`
            });

      - name: Comment on issue (Failure)
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const issueNumber = process.env.ISSUE_NUMBER;
            const errorReason = `${{ steps.parse-issue.outputs.error_reason }}`.trim();
            
            let body = `❌ **Claim Failed**\n\n`;
            if (errorReason) {
              body += `**Reason:** ${errorReason}\n\nPlease choose a different, unclaimed coordinate or verify your issue formatting.`;
            } else {
              body += `An unexpected system error occurred while processing this claim. Please check the workflow logs or contact the repository owner.`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(issueNumber),
              body: body
            });
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
