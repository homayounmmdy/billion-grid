# .github/workflows/process-claim.yml
name: Process Block Claim

on:
  issues:
    types: [opened, labeled]

jobs:
  process-claim:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Parse issue and validate claim
        id: parse-issue
        run: |
          node << 'EOF'
          const fs = require('fs');
          const path = require('path');
          
          const issueTitle = process.env.ISSUE_TITLE;
          const issueBody = process.env.ISSUE_BODY || '';
          const issueUser = process.env.ISSUE_USER;
          const issueNumber = process.env.ISSUE_NUMBER;
          const githubOutput = process.env.GITHUB_OUTPUT;
          
          // 1. Validate Issue Title
          if (!issueTitle.includes('Claim: Square')) {
            console.log('ℹ️ Issue title does not match "Claim: Square". Skipping.');
            process.exit(0);
          }
          
          // 2. Parse Issue Body
          const data = {};
          const lines = issueBody.split('\n');
          for (const line of lines) {
            const trimmed = line.trim();
            if (trimmed.startsWith('X:')) data.x = trimmed.replace('X:', '').trim();
            else if (trimmed.startsWith('Y:')) data.y = trimmed.replace('Y:', '').trim();
            else if (trimmed.startsWith('Color:')) data.color = trimmed.replace('Color:', '').trim();
            else if (trimmed.startsWith('UserId:')) data.userid = trimmed.replace('UserId:', '').trim();
          }
          
          if (!data.x || !data.y || !data.color || !data.userid) {
            console.error('❌ Missing required fields in issue body.');
            process.exit(1);
          }
          
          const x = parseInt(data.x, 10);
          const y = parseInt(data.y, 10);
          
          if (isNaN(x) || isNaN(y)) {
            console.error('❌ X and Y must be valid numbers.');
            process.exit(1);
          }
          
          // 3. Read existing grid data
          const filePath = 'public/grid-data.json';
          if (!fs.existsSync(filePath)) {
            fs.mkdirSync(path.dirname(filePath), { recursive: true });
            fs.writeFileSync(filePath, '[]');
          }
          
          let gridData = [];
          try {
            gridData = JSON.parse(fs.readFileSync(filePath, 'utf8'));
          } catch (e) {
            gridData = [];
          }
          
          // 4. Validation Check 1: Is coordinate taken?
          const existingCoordinate = gridData.find(block => block.x === x && block.y === y);
          if (existingCoordinate) {
            console.error(`❌ Block (${x}, ${y}) is already claimed by UserId: ${existingCoordinate.userId}`);
            process.exit(1);
          }
          
          // 4. Validation Check 2: Does user already have a block? (Improved logging)
          const existingUserBlock = gridData.find(block => block.userId === data.userid);
          if (existingUserBlock) {
            console.error(`❌ User '${data.userid}' already has a claimed block at (${existingUserBlock.x}, ${existingUserBlock.y}).`);
            console.error('   If this was a test, please delete that entry from public/grid-data.json on the main branch first.');
            process.exit(1);
          }
          
          // 5. Add new block to JSON
          const newBlock = {
            x: x,
            y: y,
            userId: data.userid,
            color: data.color,
            timestamp: new Date().toISOString(),
            claimedBy: issueUser,
            claimMethod: 'github-issue',
            issueNumber: parseInt(issueNumber, 10)
          };
          
          gridData.push(newBlock);
          fs.writeFileSync(filePath, JSON.stringify(gridData, null, 2));
          
          // 6. Save outputs for the PR step
          fs.appendFileSync(githubOutput, `x=${x}\n`);
          fs.appendFileSync(githubOutput, `y=${y}\n`);
          fs.appendFileSync(githubOutput, `color=${data.color}\n`);
          fs.appendFileSync(githubOutput, `userid=${data.userid}\n`);
          fs.appendFileSync(githubOutput, `valid=true\n`);
          
          // Save metadata for comments
          fs.writeFileSync('/tmp/claim-info.json', JSON.stringify({ ...newBlock, issueUser, issueNumber }));
          
          console.log('✅ Claim validated and JSON updated successfully.');
          EOF
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}

      - name: Create Pull Request
        if: steps.parse-issue.outputs.valid == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat: add block claim for @${{ github.event.issue.user.login }} (#${{ github.event.issue.number }})"
          branch: "claim/issue-${{ github.event.issue.number }}"
          delete-branch: true
          title: "🎯 Block claim by @${{ github.event.issue.user.login }} (#${{ github.event.issue.number }})"
          body: |
            ## 🎯 Automated Block Claim
            
            This PR adds a new block to `public/grid-data.json` based on an issue request.
            
            ### 📋 Claim Details
            - **Claimed By (GitHub):** @${{ github.event.issue.user.login }}
            - **Requested UserId:** `${{ steps.parse-issue.outputs.userid }}`
            - **Coordinates:** (`${{ steps.parse-issue.outputs.x }}`, `${{ steps.parse-issue.outputs.y }}`)
            - **Color:** `${{ steps.parse-issue.outputs.color }}`
            - **Source Issue:** #${{ github.event.issue.number }}
            
            ### 📝 Changes
            This PR appends the new entry to [public/grid-data.json](https://github.com/homayounmmdy/billion-grid/blob/main/public/grid-data.json).
            
            *This PR was automatically generated by the **Process Block Claim** workflow.*
          labels: "automated-pr, block-claim"

      - name: Comment on issue (Success)
        if: success() && steps.parse-issue.outputs.valid == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const claimInfo = JSON.parse(fs.readFileSync('/tmp/claim-info.json', 'utf8'));
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: claimInfo.issueNumber,
              body: `✅ **Claim validated and PR created!**\n\n` +
                    `A pull request has been automatically generated to add your block at **(${claimInfo.x}, ${claimInfo.y})** for user **${claimInfo.userId}**.\n\n` +
                    `The repository owner will review and merge it shortly.`
            });

      - name: Comment on issue (Failure)
        if: failure() && steps.parse-issue.outputs.valid != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = process.env.ISSUE_NUMBER;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(issueNumber),
              body: `❌ **Claim Failed**\n\n` +
                    `This claim could not be processed. Please check the "Process Block Claim" workflow logs for the exact reason.\n\n` +
                    `Common reasons:\n` +
                    `- The coordinates are already claimed.\n` +
                    `- The UserId already has a claimed block (check for old test entries).\n` +
                    `- The issue body was formatted incorrectly.`
            });
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
